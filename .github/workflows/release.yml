name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          else
            echo "Version already matches tag, skipping update"
          fi

      - name: Generate release notes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Prefer the matching section from CHANGELOG.md; fall back to commit log.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ ("^## \\[" ver "\\]") { flag=1; next }
              /^## \[/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md entry for $VERSION, falling back to commit log"
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            echo "## What's Changed" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            if [ -z "$PREV_TAG" ]; then
              git log --pretty=format:"- %s (%h)" --no-merges >> RELEASE_NOTES.md
            else
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges >> RELEASE_NOTES.md
            fi
            echo "" >> RELEASE_NOTES.md
            if [ -z "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/v${VERSION}" >> RELEASE_NOTES.md
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}" >> RELEASE_NOTES.md
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
